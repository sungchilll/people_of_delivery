name: App With Github Actions with docker-compose CI/CD

on: workflow_dispatch

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # - name: Run tests
      #   run: |
      #     chmod +x gradlew
      #     ./gradlew test --no-daemon

      - name: Inject application.yml for deployment
        run: |
          mkdir -p src/main/resources
          echo -e "${{ secrets.APPYML }}" > src/main/resources/application.yml

      - name: Inject docker-compose.yml for deployment
        run: |
          mkdir -p ./
          echo -e "${{ secrets.DOCKER_COMPOSE_YML }}" > docker-compose.yml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/peopleofdelivery:latest

      - name: Upload docker-compose.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose.yml
          path: docker-compose.yml
      
      - name: Upload application.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: application.yml
          path: src/main/resources/application.yml


  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download docker-compose.yml
        uses: actions/download-artifact@v4
        with:
          name: docker-compose.yml
          path: ./
      
      - name: Download application.yml
        uses: actions/download-artifact@v4
        with:
          name: application.yml
          path: ./

      - name: Verify docker-compose.yml
        run: ls -l docker-compose.yml

      - name: Verify application.yml
        run: cat application.yml

      - name: Upload docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.EC2_USERNAME }}/
        
      - name: Upload application.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: application.yml
          target: /home/${{ secrets.EC2_USERNAME }}/

      - name: Execute Deployment Script on EC2 (Amazon Linux 2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            #— JDK 21 설치 (Amazon Corretto 21)
            if ! java -version 2>&1 | grep -q "Corretto"; then
              sudo yum update -y
              sudo yum install -y java-21-amazon-corretto-devel
              echo 'export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto.x86_64' \
                | sudo tee /etc/profile.d/jdk21.sh
              sudo chmod +x /etc/profile.d/jdk21.sh
              source /etc/profile.d/jdk21.sh
            fi

            #— Docker 설치
            if ! command -v docker &> /dev/null; then
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            #— Docker Compose 설치
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L \
                "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            cd /home/${{ secrets.EC2_USERNAME }}

            # 1) application.yml 이 있는지 확인
            if [[ -f "application.yml" ]]; then
              echo "Using application.yml:"
              cat application.yml
            else
              echo "Error: application.yml not found!"
              exit 1
            fi

            # 2) docker-compose
            sudo docker-compose down
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/peopleofdelivery:latest
            sudo docker-compose up -d

            sudo docker logs $(sudo docker ps -q -f name=backend-server)
            sudo docker image prune -a -f
