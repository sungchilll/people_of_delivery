name: CI/CD Pipeline for People of Delivery

on: workflow_dispatch

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # - name: Run tests
      #   run: |
      #     chmod +x gradlew
      #     ./gradlew test --no-daemon

      - name: Inject application.yml for deployment
        run: |
          mkdir -p src/main/resources
          echo -e "${{ secrets.APPYML }}" > src/main/resources/application.yml

      - name: Inject docker-compose.yml for deployment
        run: |
          mkdir -p ./
          echo -e "${{ secrets.DOCKER_COMPOSE_YML }}" > docker-compose.yml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/peopleofdelivery:latest

      - name: Upload docker-compose.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose.yml
          path: docker-compose.yml
      
      - name: Upload application.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: application.yml
          path: src/main/resources/application.yml
        
      - name: Upload deploy.sh artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy.sh
          path: deploy.sh


  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download docker-compose.yml
        uses: actions/download-artifact@v4
        with:
          name: docker-compose.yml
          path: ./
      
      - name: Download application.yml
        uses: actions/download-artifact@v4
        with:
          name: application.yml
          path: ./

      - name: Download deploy.sh
        uses: actions/download-artifact@v4
        with:
          name: deploy.sh
          path: ./

      - name: Verify docker-compose.yml
        run: ls -l docker-compose.yml

      - name: Verify application.yml
        run: cat application.yml

      - name: Verify deploy.sh
        run: cat deploy.sh

      - name: Upload docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source:  |
            docker-compose.yml
            application.yml
          target: /home/${{ secrets.EC2_USERNAME }}/
        
      - name: Upload files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: application.yml
          target: /home/${{ secrets.EC2_USERNAME }}/

      - name: Deploy from Bastion to App Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            chmod +x deploy.sh
            ./deploy.sh ${{ secrets.PRIVATE_APP_HOST }} ${{ secrets.EC2_USERNAME }} ${{ secrets.EC2_PRIVATE_KEY }}
            echo "Deployment completed successfully."
